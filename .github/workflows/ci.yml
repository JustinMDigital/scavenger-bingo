name: Verify

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, build, and browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPPORT_EMAIL: release-test@example.test
      VITE_GOOGLE_CLIENT_ID: 123456789-release.apps.googleusercontent.com

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit full dependency lockfile
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run core and interface tests
        run: npm run test

      - name: Build production bundle
        run: npm run build:release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_DIRTY: "false"

      - name: Verify Cloudflare packaging
        run: npx wrangler deploy --dry-run --outdir /tmp/scavenger-bingo-wrangler-dry-run

      - name: Run desktop and phone browser journeys
        run: npm run test:e2e

      - name: Preserve browser evidence after a failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
